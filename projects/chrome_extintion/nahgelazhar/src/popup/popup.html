<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Nahgelazhar helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>Nahgelazhar helper<small>Settings apply immediately to the website</small></header>
  <main>
    <label><div class="t"><b>Use the new subject and lecture layout</b><span>Disabling it restores the website's original list</span></div><input type="checkbox" data-k="newView"></label>
    <label><div class="t"><b>Show the literature section</b><span>Show literature units</span></div><input type="checkbox" data-k="showLit"></label>
    <label><div class="t"><b>Include literature in statistics</b><span>Works with phase 2</span></div><input type="checkbox" data-k="statsLit"></label>
    <label><div class="t"><b>Sort lessons</b><span>Before, explanation, board, homework, after, and comprehensive</span></div><input type="checkbox" data-k="sortLessons"></label>
    <label><div class="t"><b>Show hidden items in statistics</b><span>Works with phase 2</span></div><input type="checkbox" data-k="statsHidden"></label>
    <label><div class="t"><b>Show empty types and subjects</b><span>Works with phase 2</span></div><input type="checkbox" data-k="showEmpty"></label>
  </main>
  <div class="reset"><button id="resetManual" type="button">Clear My Manual Classifications</button></div>
  <footer>Open the Nahj Al-Azhar website once after updating to migrate the previous settings.</footer>
  <script src="popup.js"></script>
</body>
</html>
