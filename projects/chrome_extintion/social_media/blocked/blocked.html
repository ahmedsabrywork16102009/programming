<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Blocked | FocusBlock</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="blocked-container">
    <img src="../assets/icon128.png" alt="FocusBlock Logo" class="blocked-logo">
    <h1 id="mainTitle">Website Blocked</h1>
    <div class="subtitle" id="subTitle">Focus Mode Active</div>
    
    <div class="message" id="messageText">
      This page is blocked based on your active FocusBlock rules. Stay focused on your goals!
    </div>

    <div class="blocked-url" id="blockedUrl">
      website.com
    </div>

    <div class="button-group">
      <button class="back-btn" id="backBtn">Go Back</button>
    </div>

    <div class="info-text" id="infoText">
      💡 To access this website, click the FocusBlock extension icon and update your lists.
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
